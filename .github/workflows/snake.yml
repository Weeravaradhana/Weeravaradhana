
name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Weeravaradhana
          outputs: |
            dist/github-snake.svg?palette=github-dark

      - name: Publish Snake to Output Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            publish

          cd publish

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan output-temp
          git rm -rf . || true

          cp ../dist/github-snake.svg ./github-snake.svg

          git add github-snake.svg
          git commit -m "chore: update contribution snake"

          git push origin HEAD:output --force
